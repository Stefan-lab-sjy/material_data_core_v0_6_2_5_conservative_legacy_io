[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "material-data-core"
version = "0.6.2.5"
description = "Material research data core with recursive auto intake, context-aware VASP/VASPKIT I/O semantics, workflow inference, filename fidelity, recipe library and agent tools"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
